services:
  mysql:
    image: mysql:8.4
    container_name: ledger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ledger123
      MYSQL_DATABASE: ledger_view
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger123
    ports:
      - "3306:3306"
    volumes:
      - ./jraft_ledger/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ledger-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --max-connections=1000

  kafka:
    image: apache/kafka:3.9.0
    container_name: ledger-kafka
    hostname: ledger-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://ledger-kafka:9092,CONTROLLER://ledger-kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ledger-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ledger-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
    volumes:
      - ./jraft_ledger/kafka:/var/lib/kafka/data
    networks:
      - ledger-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ledger-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ledger-kafka:9092
    depends_on:
      - kafka
    networks:
      - ledger-net

  ledger-base:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledger-node:latest
    profiles: ["build"]

  ledger1:
    image: ledger-node:latest
    container_name: ledger-node-1
    hostname: ledger-node-1
    ports:
      - "8081:8080"
      - "28081:28080"
    environment:
      SERVER_PORT: 8080
      RAFT_SERVER_PORT: 28080
      NODE_ID: ledger-node-1
      PEER_NODES: ledger-node-1:28080,ledger-node-2:28080,ledger-node-3:28080
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
      LEDGER_ADVERTISE_URL: http://localhost:8081
      JAVA_OPTS: >-
        -Xms2g
        -Xmx2g
        -XX:+UseZGC
        -XX:MaxGCPauseMillis=5
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc*:file=/var/lib/ledger/gc.log:time,uptime:filecount=10,filesize=50m
        -Dmanagement.endpoints.web.exposure.include=health,prometheus,metrics,info
        -Dmanagement.metrics.export.prometheus.enabled=true
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/lib/ledger/
        -XX:ErrorFile=/var/lib/ledger/hs_err_pid_%p.log
        -XX:+UnlockDiagnosticVMOptions
        -XX:+LogVMOutput
        -XX:LogFile=/var/lib/ledger/vm.log
        -Djdk.tracePinnedThreads=full
        -XX:-OmitStackTraceInFastThrow
        -Xcheck:jni
        -Dserver.shutdown.grace-period=30s
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./jraft_ledger/node1:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  ledger2:
    image: ledger-node:latest
    container_name: ledger-node-2
    hostname: ledger-node-2
    ports:
      - "8082:8080"
      - "28082:28080"
    environment:
      SERVER_PORT: 8080
      RAFT_SERVER_PORT: 28080
      NODE_ID: ledger-node-2
      PEER_NODES: ledger-node-1:28080,ledger-node-2:28080,ledger-node-3:28080
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
      LEDGER_ADVERTISE_URL: http://localhost:8082
      JAVA_OPTS: >-
        -Xms2g
        -Xmx2g
        -XX:+UseZGC
        -XX:MaxGCPauseMillis=5
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc*:file=/var/lib/ledger/gc.log:time,uptime:filecount=10,filesize=50m
        -Dmanagement.endpoints.web.exposure.include=health,prometheus,metrics,info
        -Dmanagement.metrics.export.prometheus.enabled=true
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/lib/ledger/
        -XX:ErrorFile=/var/lib/ledger/hs_err_pid_%p.log
        -XX:+UnlockDiagnosticVMOptions
        -XX:+LogVMOutput
        -XX:LogFile=/var/lib/ledger/vm.log
        -Djdk.tracePinnedThreads=full
        -XX:-OmitStackTraceInFastThrow
        -Xcheck:jni
        -Dserver.shutdown.grace-period=30s
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
    depends_on:
      ledger1:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./jraft_ledger/node2:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  ledger3:
    image: ledger-node:latest
    container_name: ledger-node-3
    hostname: ledger-node-3
    ports:
      - "8083:8080"
      - "28083:28080"
    environment:
      SERVER_PORT: 8080
      RAFT_SERVER_PORT: 28080
      NODE_ID: ledger-node-3
      PEER_NODES: ledger-node-1:28080,ledger-node-2:28080,ledger-node-3:28080
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
      LEDGER_ADVERTISE_URL: http://localhost:8083
      JAVA_OPTS: >-
        -Xms2g
        -Xmx2g
        -XX:+UseZGC
        -XX:MaxGCPauseMillis=5
        -XX:+ExitOnOutOfMemoryError
        -Xlog:gc*:file=/var/lib/ledger/gc.log:time,uptime:filecount=10,filesize=50m
        -Dmanagement.endpoints.web.exposure.include=health,prometheus,metrics,info
        -Dmanagement.metrics.export.prometheus.enabled=true
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/lib/ledger/
        -XX:ErrorFile=/var/lib/ledger/hs_err_pid_%p.log
        -XX:+UnlockDiagnosticVMOptions
        -XX:+LogVMOutput
        -XX:LogFile=/var/lib/ledger/vm.log
        -Djdk.tracePinnedThreads=full
        -XX:-OmitStackTraceInFastThrow
        -Xcheck:jni
        -Dserver.shutdown.grace-period=30s
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
    depends_on:
      ledger2:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./jraft_ledger/node3:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: ledger-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./jraft_ledger/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ledger-net

  grafana:
    image: grafana/grafana:latest
    container_name: ledger-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./jraft_ledger/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ledger-net

  projection:
    build:
      context: .
      dockerfile: Dockerfile.projection
    container_name: ledger-projection
    hostname: ledger-projection
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger123
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      KAFKA_CONSUMER_CONCURRENCY: 4
      SNOWFLAKE_WORKER_ID: 9
      LEDGER_PROJECTION_BALANCE_WORKERS: 2
      JAVA_OPTS: >-
        -Xms2g
        -Xmx2g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=50
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/lib/projection/
        -XX:ErrorFile=/var/lib/projection/hs_err_pid_%p.log
        -Dmanagement.endpoints.web.exposure.include=health,prometheus,metrics,info
        -Dmanagement.metrics.export.prometheus.enabled=true
        -Dserver.shutdown.grace-period=30s
    volumes:
      - ./jraft_ledger/projection:/var/lib/projection
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ledger-net
    restart: unless-stopped

networks:
  ledger-net:
    driver: bridge
