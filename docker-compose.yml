services:
  mysql:
    image: mysql:8.4
    container_name: ledger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ledger123
      MYSQL_DATABASE: ledger_view
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger123
    ports:
      - "3306:3306"
    volumes:
      - ./jraft_ledger/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ledger-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --max-connections=1000

  kafka:
    image: apache/kafka:3.9.0
    container_name: ledger-kafka
    hostname: ledger-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://ledger-kafka:9092,CONTROLLER://ledger-kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ledger-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@ledger-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - ./jraft_ledger/kafka:/var/lib/kafka/data
    networks:
      - ledger-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ledger-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ledger
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ledger-kafka:9092
    depends_on:
      - kafka
    networks:
      - ledger-net

  ledger1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-node-1
    hostname: ledger-node-1
    ports:
      - "8081:8080"
      - "28081:28080"
    environment:
      SERVER_PORT: 8080
      RAFT_SERVER_PORT: 28080
      NODE_ID: ledger-node-1
      PEER_NODES: ledger-node-1:28080,ledger-node-2:28080,ledger-node-3:28080
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./jraft_ledger/node1:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  ledger2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-node-2
    hostname: ledger-node-2
    ports:
      - "8082:8080"
      - "28082:28080"
    environment:
      SERVER_PORT: 8080
      RAFT_SERVER_PORT: 28080
      NODE_ID: ledger-node-2
      PEER_NODES: ledger-node-1:28080,ledger-node-2:28080,ledger-node-3:28080
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
    depends_on:
      ledger1:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./jraft_ledger/node2:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  ledger3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-node-3
    hostname: ledger-node-3
    ports:
      - "8083:8080"
      - "28083:28080"
    environment:
      SERVER_PORT: 8080
      RAFT_SERVER_PORT: 28080
      NODE_ID: ledger-node-3
      PEER_NODES: ledger-node-1:28080,ledger-node-2:28080,ledger-node-3:28080
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
    depends_on:
      ledger2:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./jraft_ledger/node3:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  projection:
    build:
      context: .
      dockerfile: Dockerfile.projection
    container_name: ledger-projection
    hostname: ledger-projection
    ports:
      - "8089:8089"
    environment:
      SERVER_PORT: 8089
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger123
      KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      SNOWFLAKE_WORKER_ID: 9
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ledger-net
    restart: unless-stopped

networks:
  ledger-net:
    driver: bridge
