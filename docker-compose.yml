version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: ledger-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ledger123
      MYSQL_DATABASE: ledger_view
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ledger-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=1000

  kafka:
    image: apache/kafka:3.9.0
    container_name: ledger-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ledger-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ledger-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  ledger1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-node-1
    ports:
      - "8081:8080"
      - "8091:8090"
    environment:
      NODE_ID: ledger-node-1
      RAFT_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:mysql://ledger-mysql:3306/ledger_view
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger123
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
      PEER_NODES: ledger-node-2:8090,ledger-node-3:8090
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ledger1_data:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  ledger2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-node-2
    ports:
      - "8082:8080"
      - "8092:8090"
    environment:
      NODE_ID: ledger-node-2
      RAFT_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:mysql://ledger-mysql:3306/ledger_view
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger123
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
      PEER_NODES: ledger-node-1:8090,ledger-node-3:8090
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ledger2_data:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

  ledger3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ledger-node-3
    ports:
      - "8083:8080"
      - "8093:8090"
    environment:
      NODE_ID: ledger-node-3
      RAFT_PORT: 8090
      SPRING_DATASOURCE_URL: jdbc:mysql://ledger-mysql:3306/ledger_view
      SPRING_DATASOURCE_USERNAME: ledger
      SPRING_DATASOURCE_PASSWORD: ledger123
      LEDGER_KAFKA_BOOTSTRAP_SERVERS: ledger-kafka:9092
      LEDGER_ROCKSDB_PATH: /var/lib/ledger/rocksdb
      LEDGER_RAFT_DATA_PATH: /var/lib/ledger/raft
      PEER_NODES: ledger-node-1:8090,ledger-node-2:8090
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ledger3_data:/var/lib/ledger
    networks:
      - ledger-net
    restart: unless-stopped

networks:
  ledger-net:
    driver: bridge

volumes:
  mysql_data:
  ledger1_data:
  ledger2_data:
  ledger3_data:
