apiVersion: 1

groups:
  - name: ledger-critical
    interval: 30s
    rules:
      - alert: PostingLatencyHigh
        expr: histogram_quantile(0.95, rate(ledger_posting_duration_seconds_bucket[2m])) > 0.003
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Posting P95 latency > 3ms sustained for 2 minutes"
          description: "Current P95: {{ $value | humanizeDuration }}. Check Raft leader load, GC, RocksDB compaction."

      - alert: RaftLeaderElection
        expr: changes(ledger_raft_is_leader[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Raft leader election detected"
          description: "Leader changed in last 5 minutes. Check node health and network partition."

      - alert: JournalUnbalanced
        expr: ledger_reconciliation_l1_unbalanced_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Unbalanced journal detected in L1 reconciliation"
          description: "L1 reconciliation found {{ $value }} unbalanced journals. Immediate investigation required."

  - name: ledger-warning
    interval: 30s
    rules:
      - alert: QueueDepthHigh
        expr: ledger_account_queue_depth > 500
        labels:
          severity: warning
        annotations:
          summary: "Account queue depth > 500"
          description: "Account {{ $labels.accountId }} queue depth: {{ $value }}. Check backpressure and Raft throughput."

      - alert: GcPauseHigh
        expr: max(jvm_gc_pause_seconds_max) > 0.01
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "JVM GC pause > 10ms"
          description: "Max GC pause: {{ $value | humanizeDuration }}. Check heap pressure."

      - alert: OutboxBacklog
        expr: ledger_outbox_pending > 10000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Outbox pending events > 10,000"
          description: "Pending events: {{ $value }}. Kafka producer may be falling behind."

      - alert: ProjectionLagHigh
        expr: ledger_projection_seconds_since_last_event > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Projection consumer lag > 10 seconds"
          description: "Last event processed {{ $value }}s ago. Kafka consumer may be falling behind or stalled."

      - alert: ProjectionLagCritical
        expr: ledger_projection_seconds_since_last_event > 30
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Projection consumer lag > 30 seconds"
          description: "Last event processed {{ $value }}s ago. MySQL view layer is >30s behind State Machine."

      - alert: RejectionRateHigh
        expr: rate(ledger_posting_rejected_count[5m]) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Posting rejection rate > 10/min"
          description: "Rejection rate: {{ $value }} per second over 5m. Check application logs for error codes."
