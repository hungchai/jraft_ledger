spring:
  application:
    name: ledger-projection
  datasource:
    url: jdbc:shardingsphere:classpath:sharding-config.yaml
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ledger-projection
      auto-offset-reset: latest
      enable-auto-commit: false
      max-poll-records: 2000
      fetch-min-size: 1048576
      fetch-max-wait: 200ms
    listener:
      type: single
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:6}
      # MANUAL_IMMEDIATE: offset is committed only when the listener explicitly
      # calls ack.acknowledge() and that commit is flushed synchronously. This
      # is the prerequisite for at-least-once: the consumer must not return
      # from a poll until the projection write has hit MySQL.
      ack-mode: manual_immediate

mybatis:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    ShardingSphere-SQL: warn

ledger:
  projection:
    balance:
      workers: 2
    journal:
      flush-interval-ms: 50
      max-buffer: 4000

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
