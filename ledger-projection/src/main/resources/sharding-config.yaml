# ShardingSphere-JDBC configuration: journal_line sharded by account_account_id (VARCHAR business key)
# Docs: https://shardingsphere.apache.org/document/current/en/user-manual/shardingsphere-jdbc/yaml-config/
#
# Note: shardingColumn = account_account_id (VARCHAR, reliable hashCode()).
# Do NOT shard by account_id (BIGINT surrogate FK) — INLINE algorithm may fail
# on numeric hashCode().

dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://ledger-mysql:3306/ledger_view?allowPublicKeyRetrieval=true&useSSL=false
    username: ledger
    password: ledger123

rules:
- !SINGLE
  tables:
    - "*.*"
- !SHARDING
  tables:
    journal_line:
      actualDataNodes: ds_0.journal_line_${0..3}
      tableStrategy:
        standard:
          shardingColumn: account_account_id
          shardingAlgorithmName: account-id-hash
      keyGenerateStrategy:
        column: id
        keyGeneratorName: snowflake
    projection_event_log:
      actualDataNodes: ds_0.projection_event_log_${0..3}
      tableStrategy:
        standard:
          shardingColumn: account_account_id
          shardingAlgorithmName: event-log-account-hash
      keyGenerateStrategy:
        column: id
        keyGeneratorName: snowflake

  shardingAlgorithms:
    account-id-hash:
      type: INLINE
      props:
        algorithm-expression: journal_line_${Math.abs(account_account_id.hashCode()) % 4}
    event-log-account-hash:
      type: INLINE
      props:
        algorithm-expression: projection_event_log_${Math.abs(account_account_id.hashCode()) % 4}

  keyGenerators:
    snowflake:
      type: SNOWFLAKE
      props:
        worker-id: 1

props:
  # Logging every Logic+Actual SQL at INFO crushes projection throughput. Keep off.
  sql-show: false
